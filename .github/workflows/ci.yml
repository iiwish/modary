name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/counter/go.sum
      - run: make bootstrap
      - run: make ci
      - name: Verify the gate leaves source unchanged
        run: git status --short && test -z "$(git status --porcelain --untracked-files=all)"

  darwin-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/counter/go.sum
      - name: Record native toolchain
        run: |
          go env GOOS GOARCH GOVERSION CGO_ENABLED
          test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64
      - name: Install repository scanner
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
      - run: make bootstrap
      - run: make native-platform
      - name: Verify the gate leaves source unchanged
        run: git status --short && test -z "$(git status --porcelain --untracked-files=all)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, darwin-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/counter/go.sum
      - run: make release-preflight VERSION="${GITHUB_REF_NAME}" RELEASE_MODE=tag
      - run: make remote-consumer VERSION="${GITHUB_REF_NAME}"
      - name: Verify the release gates leave source unchanged
        run: git status --short && test -z "$(git status --porcelain --untracked-files=all)"
