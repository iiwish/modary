name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: modary_test
          POSTGRES_USER: modary
          POSTGRES_PASSWORD: modary-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modary -d modary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MODARY_TEST_DATABASE_URL: postgres://modary:modary-test-password@127.0.0.1:5432/modary_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/counter/go.sum
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
      - name: Install pinned frontend package manager
        run: npm install --global pnpm@11.1.3 && pnpm --version
      - name: Install repository scanner
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep
      - run: make bootstrap
      - run: make ci
      - name: Verify the gate leaves source unchanged
        run: git status --short && test -z "$(git status --porcelain --untracked-files=all)"

  darwin-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/counter/go.sum
      - name: Record native toolchain
        run: |
          go env GOOS GOARCH GOVERSION CGO_ENABLED
          test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64
      - name: Install repository scanner
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
      - name: Start PostgreSQL 17
        run: |
          brew list postgresql@17 >/dev/null 2>&1 || brew install postgresql@17
          prefix="$(brew --prefix postgresql@17)"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          brew services start postgresql@17
          for attempt in {1..30}; do
            "$prefix/bin/pg_isready" && break
            sleep 1
          done
          "$prefix/bin/pg_isready"
          "$prefix/bin/dropdb" --if-exists modary_test
          "$prefix/bin/createdb" modary_test
          printf 'MODARY_TEST_DATABASE_URL=postgres://%s@127.0.0.1:5432/modary_test?sslmode=disable\n' "$(id -un)" >> "$GITHUB_ENV"
      - run: make bootstrap
      - run: make native-platform
      - name: Verify the gate leaves source unchanged
        run: git status --short && test -z "$(git status --porcelain --untracked-files=all)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, darwin-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: modary_test
          POSTGRES_USER: modary
          POSTGRES_PASSWORD: modary-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modary -d modary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MODARY_TEST_DATABASE_URL: postgres://modary:modary-test-password@127.0.0.1:5432/modary_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/counter/go.sum
      - name: Install repository scanner
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep
      - run: make release-preflight VERSION="${GITHUB_REF_NAME}" RELEASE_MODE=tag
      - run: make remote-consumer VERSION="${GITHUB_REF_NAME}"
      - name: Verify the release gates leave source unchanged
        run: git status --short && test -z "$(git status --porcelain --untracked-files=all)"
