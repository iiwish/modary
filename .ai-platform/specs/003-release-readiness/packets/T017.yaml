schema_version: 1
packet_id: EP-003-T017
task_id: T017
feature_id: 003-release-readiness
mode: execute_one_task
adapter: codex-direct

governance_inputs:
  constitution: .ai-platform/memory/constitution.md
  product_contract: .ai-platform/docs/product-design.md
  feature_spec: .ai-platform/specs/003-release-readiness/spec.md
  requirements_checklist: .ai-platform/specs/003-release-readiness/checklists/requirements.md
  technical_decisions: .ai-platform/specs/003-release-readiness/plan.md
  work_graph: .ai-platform/specs/003-release-readiness/tasks.md
  analysis: .ai-platform/specs/003-release-readiness/analysis.md
  approval_gates:
    product_or_spec: Confirmed by user-approved analysis and execution request
    technical_plan_and_work_graph: Confirmed by the explicit request to complete the approved Release Readiness scope
    analysis: No unresolved Critical or High finding

work_unit:
  title: Release Governance And Claims
  goal: Establish canonical Alpha versioning, compatibility, security, ownership, release-state, and non-claim policies.
  requirements: [FR-003, FR-004, FR-009, FR-010, NFR-005, NFR-006]
  priority: P0
  depends_on: [T016]
  blocks: [T018, T019, T020]
  parallel: false
  conflicts_with: [T018, T019, T020]

codebase_context:
  relevant_files:
    - README.md
    - docs/framework-f0.md
    - docs/f0-known-limitations.md
    - docs/f0-acceptance-report.md
    - .ai-platform/docs/release-report.md
  existing_patterns:
    - current-state canonical documentation
    - explicit technical acceptance versus distribution claims
    - stable requirement IDs and evidence-backed task states
  interfaces_or_contracts:
    - .ai-platform/specs/003-release-readiness/spec.md
    - .ai-platform/specs/002-framework-decoupling/spec.md
  forbidden_changes:
    - selecting a redistribution license without owner approval
    - claiming a remote, tag, or release that does not exist
    - adding downstream product vocabulary or release artifacts

execution_constraints:
  branch_or_worktree: current clean codex/f0-hardening worktree
  allowed_files:
    - .ai-platform/specs/003-release-readiness/**
    - .ai-platform/docs/**
    - .ai-platform/evidence/T017/**
    - CHANGELOG.md
    - CONTRIBUTING.md
    - SECURITY.md
    - docs/releases/**
    - scripts/check-docs.sh
    - scripts/check_docs_test.go
  test_targets:
    - scripts/check-docs.sh
    - governance artifact validator
  ownership_notes:
    - preserve accepted T010-T016 evidence and framework contract

tdd_plan:
  required: false
  exception: documentation-only governance task uses deterministic document and artifact validation
  red:
    command: inspect existing release-report and required-document coverage
    expected_failure: versioning, release process, security, contribution, and changelog documents are absent
  green:
    command: make docs-check
    expected_signal: canonical documentation remains internally consistent
  refactor:
    command: git diff --check
    expected_signal: documentation remains canonical and whitespace-clean

validation_loop:
  commands:
    - make docs-check
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/modary --feature-id 003-release-readiness --task-id T017 --strict
    - git diff --check
  retry_budget: 3
  failure_policy:
    first_failure: repair the direct documentation or artifact inconsistency
    second_failure: re-check scope and canonical claim ownership
    beyond_budget: report the exact blocker without weakening a release claim

evidence_contract:
  summary: .ai-platform/evidence/T017/summary.md
  diff: .ai-platform/evidence/T017/diff.patch
  test_results: .ai-platform/evidence/T017/test-results.md
  required: [changed_files, validation_results, claim_review, residual_risk]

review_contract:
  required_passes: [spec_compliance, release_claims, security_policy, engineering_quality]
  acceptance_rule: complete only when documents contain no invented owner decision or distribution claim

handoff:
  external_issue: null
  pull_request: null
  next_tasks: [T018]
  finish_options: [continue governed work graph]

stop_conditions:
  - a policy requires choosing a license or repository visibility on the owner's behalf
  - an existing accepted F0 claim would need to be weakened without technical evidence
