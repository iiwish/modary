schema_version: 1
packet_id: EP-003-T018
task_id: T018
feature_id: 003-release-readiness
mode: execute_one_task
adapter: codex-direct

governance_inputs:
  constitution: .ai-platform/memory/constitution.md
  product_contract: .ai-platform/docs/product-design.md
  feature_spec: .ai-platform/specs/003-release-readiness/spec.md
  requirements_checklist: .ai-platform/specs/003-release-readiness/checklists/requirements.md
  technical_decisions: .ai-platform/specs/003-release-readiness/plan.md
  work_graph: .ai-platform/specs/003-release-readiness/tasks.md
  analysis: .ai-platform/specs/003-release-readiness/analysis.md
  approval_gates:
    release_governance: T017 Completed
    product_or_spec: Confirmed by user
    analysis: No unresolved Critical or High finding

work_unit:
  title: Adoption And Operations Documentation
  goal: Deliver a detailed, navigable documentation system for consumers, operators, and security reviewers.
  requirements: [FR-001, FR-002, FR-005, NFR-001, NFR-002]
  priority: P0
  depends_on: [T017]
  blocks: [T020]
  parallel: false
  conflicts_with: [T019, T020]

codebase_context:
  relevant_files:
    - README.md
    - docs/framework-f0.md
    - docs/f0-known-limitations.md
    - docs/adr/**
    - testdata/external-consumer/**
  existing_patterns:
    - external consumer is the executable adoption contract
    - framework-f0 is the deep canonical contract
    - current-state documentation avoids change-narrative wording
  interfaces_or_contracts:
    - public packages listed in README.md
    - testdata/external-consumer/internal/project/project.go
    - testdata/external-consumer/modary.yaml
  forbidden_changes:
    - duplicating the complete F0 contract into every guide
    - examples that import internal packages
    - claiming public-internet IAM, arbitrary storage, HA, or distributed transactions
    - downstream product-specific instructions

execution_constraints:
  branch_or_worktree: current
  allowed_files:
    - README.md
    - docs/index.md
    - docs/getting-started/**
    - docs/concepts/**
    - docs/how-to/**
    - docs/reference/**
    - docs/operations/**
    - docs/releases/**
    - scripts/check-docs.sh
    - scripts/check-doc-links.sh
    - scripts/check_doc_links_test.go
    - scripts/check_docs_test.go
    - Makefile
    - .ai-platform/evidence/T018/**
    - .ai-platform/specs/003-release-readiness/tasks.md
    - .ai-platform/specs/003-release-readiness/packets/T018.yaml
  test_targets:
    - scripts/check_doc_links_test.go
    - scripts/check_docs_test.go
    - testdata/external-consumer/**

tdd_plan:
  required: true
  exception: documentation prose is validated directly; checker behavior uses RED/GREEN
  red:
    command: go test ./scripts -run TestCheckDocLinks -count=1
    expected_failure: required navigation and broken local links are not yet checked
  green:
    command: go test ./scripts -run 'TestCheckDocLinks|TestCheckDocs' -count=1
    expected_signal: required documents and local links pass, malformed fixtures fail closed
  refactor:
    command: make docs-check verify check-generated
    expected_signal: navigation and executable consumer contracts remain green

validation_loop:
  commands:
    - go test ./scripts -run 'TestCheckDocLinks|TestCheckDocs' -count=1
    - make docs-check verify check-generated
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/modary --feature-id 003-release-readiness --task-id T018 --strict
    - git diff --check
  retry_budget: 3
  failure_policy:
    first_failure: repair the direct navigation, example, or checker defect
    second_failure: compare the guide against the external-consumer executable contract
    beyond_budget: report the exact documentation or tooling blocker

evidence_contract:
  summary: .ai-platform/evidence/T018/summary.md
  diff: .ai-platform/evidence/T018/diff.patch
  test_results: .ai-platform/evidence/T018/test-results.md
  required: [red_green_results, changed_files, navigation_audit, command_validation, residual_risk]

review_contract:
  required_passes: [consumer_adoption, operations, security_boundaries, link_integrity, engineering_quality]
  acceptance_rule: complete only when every new document is reachable and examples match public consumer contracts

handoff:
  external_issue: null
  pull_request: null
  next_tasks: [T019]
  finish_options: [continue governed work graph]

stop_conditions:
  - documentation requires an unimplemented public API
  - a guide would need to hide an F0 limitation to present a successful path
