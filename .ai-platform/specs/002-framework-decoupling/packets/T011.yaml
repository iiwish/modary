schema_version: 1
packet_id: EP-002-T011
task_id: T011
feature_id: 002-framework-decoupling
mode: execute_one_task
adapter: codex-subagent
governance_inputs:
  constitution: .ai-platform/memory/constitution.md
  spec: .ai-platform/specs/002-framework-decoupling/spec.md
  checklist: .ai-platform/specs/002-framework-decoupling/checklists/requirements.md
  plan: .ai-platform/specs/002-framework-decoupling/plan.md
  analysis: .ai-platform/specs/002-framework-decoupling/analysis.md
  work_graph: .ai-platform/specs/002-framework-decoupling/tasks.md
  approval: explicit user approval and autonomous completion request on 2026-07-30
work_unit:
  title: Build Public Kernel And Lifecycle
  goal: Implement pure Module Definitions, typed capability services, safe lifecycle, Action binding ownership, and opaque execution scope.
  requirements: [FR-001, FR-002, FR-003, FR-004, FR-005, FR-010, NFR-001, NFR-004, NFR-005, NFR-006]
  dependencies: [T010]
codebase_context:
  relevant_files:
    - module/host.go
    - module/services.go
    - module/manifest.go
    - module/definition.go
    - module/graph.go
    - action/registry.go
    - action/runtime.go
    - action/types.go
    - identity/identity.go
    - authz/authz.go
    - audit/audit.go
    - database/migration.go
    - scope/scope.go
  invariants:
    - handlers execute only through Action Runtime
    - Definition inspection has no side effects
    - Runtime Preview, authorization, plan, idempotency, transaction, and audit semantics remain intact
    - cleanup covers process resources and bindings, not committed migrations
execution_constraints:
  allowed_files:
    - go.mod
    - go.sum
    - action/**
    - audit/**
    - authz/**
    - database/**
    - identity/**
    - module/**
    - scope/**
    - internal/authority/**
  forbidden_changes:
    - application, transport, CLI, Adapter, UI, or consumer behavior changes
    - dynamic module discovery
    - silent production fallback to ephemeral governance stores
  worktree: build on all existing changes; do not reset or rewrite consumer-owned work
  delegation: worker may not delegate further and must stop if compilation requires behavior edits outside allowed files
tdd_plan:
  red:
    - add tests for pure definitions, typed keys, undeclared capability access, owner binding, partial failure, reverse/LIFO cleanup, joined errors, cancellation cleanup, and invalid state transitions
    - add tests proving the public catalog contains descriptors but no handlers
  green:
    - implement sealed Scope, stateful Host, generic keys, Action bindings, and execution scope with the smallest coherent API
  refactor:
    - remove Host alias and mutable handler/catalog exposure while keeping Runtime behavior focused
validation_loop:
  commands:
    - go test ./action ./audit ./authz ./database ./identity ./module ./scope
    - go test -race ./action ./audit ./authz ./database ./identity ./module ./scope
    - go vet ./action ./audit ./authz ./database ./identity ./module ./scope
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/modary --feature-id 002-framework-decoupling --task-id T011 --strict
    - git diff --check
  expected_signals:
    - lifecycle order and cleanup tests pass deterministically
    - capability and Action ownership violations fail closed
    - existing Runtime behavior tests remain green after scope migration
  retry_budget: 3
evidence_contract:
  path: .ai-platform/evidence/T011/summary.md
  required: [changed_files, red_result, green_result, validation, public_api_review, residual_risk]
review_contract:
  layers: [spec_compliance, engineering_quality, concurrency_and_lifecycle]
handoff:
  next_task: T012
  task_status_after_review: Needs_Review
stop_conditions:
  - a Runtime governance invariant would be weakened
  - behavior edits outside the allowed Kernel scope are required
  - consumer-owned migrations would need destructive rewriting
