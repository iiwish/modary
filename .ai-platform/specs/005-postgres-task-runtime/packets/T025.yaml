  required: true
  red:
    command: focused adapter tests against PostgreSQL before SQL port
    expected_failure: SQLite placeholders and DDL are rejected
  green:
    command: go test ./internal/databasecontrol ./adapters/postgres ./adapters/localidentity ./adapters/rbac ./adapters/sqlaudit
    expected_signal: standard persistence contracts pass
  refactor:
    command: go test -race ./adapters/postgres ./adapters/localidentity ./adapters/rbac ./adapters/sqlaudit
    expected_signal: concurrent access is race free
validation_loop:
  commands: [go test ./internal/databasecontrol ./adapters/postgres ./adapters/localidentity ./adapters/rbac ./adapters/sqlaudit, go test -race ./adapters/postgres ./adapters/localidentity ./adapters/rbac ./adapters/sqlaudit, git diff --check]
evidence_contract:
